<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="nobara" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#500724" stop-opacity="0"/>
      <stop offset="20%" stop-color="#DB2777" stop-opacity=".8"/>
      <stop offset="40%" stop-color="#F472B6" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FDF2F8" stop-opacity="1"/>
      <stop offset="60%" stop-color="#F472B6" stop-opacity="1"/>
      <stop offset="80%" stop-color="#DB2777" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#500724" stop-opacity="0"/>
    </linearGradient>

    <filter id="nobaraGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .resonance {
        animation: resonance 2.5s ease-in-out infinite;
        transform-origin:center;
      }

      @keyframes resonance {
        0%,100% { opacity:.4; transform:scaleX(.85); }
        45% { opacity:1; transform:scaleX(1); }
        55% { opacity:.65; transform:scaleX(.95); }
      }
    </style>
  </defs>

  <rect class="resonance"
        x="0" y="4"
        width="1200" height="4"
        rx="2"
        fill="url(#nobara)"
        filter="url(#nobaraGlow)"/>

  <rect class="resonance"
        x="0" y="4.5"
        width="1200" height="3"
        rx="1.5"
        fill="url(#nobara)"/>
</svg>