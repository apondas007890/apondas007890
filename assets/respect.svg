<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28">
  <defs>
    <style>
      .hands-group {
        animation: sequenceControl 3.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 32px 52px;
      }
      .left-hand {
        animation: snapLeft 3.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 32px 48px;
      }
      .right-hand {
        animation: snapRight 3.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 32px 48px;
      }

      @keyframes sequenceControl {
        0%, 25% {
          opacity: 0;
          transform: translateY(6px) scale(0.9);
        }
        26% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        33% {
          transform: translateY(2.5px) scale(0.97);
        }
        42%, 85% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        95%, 100% {
          opacity: 0;
          transform: translateY(4px) scale(0.92);
        }
      }

      @keyframes snapLeft {
        0%, 25% {
          transform: translateX(-18px) rotate(-22deg);
        }
        26%, 85% {
          transform: translateX(0) rotate(0deg);
        }
        95%, 100% {
          transform: translateX(-12px) rotate(-15deg);
        }
      }

      @keyframes snapRight {
        0%, 25% {
          transform: translateX(18px) rotate(22deg);
        }
        26%, 85% {
          transform: translateX(0) rotate(0deg);
        }
        95%, 100% {
          transform: translateX(12px) rotate(15deg);
        }
      }
    </style>
  </defs>

  <g class="hands-group">
    <!-- Left Hand -->
    <g class="left-hand">
      <polygon points="12,56 24,56 21,43 15,45" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M21 43 L29 20 C29 16, 32 16, 32 20 L32 40 L23 48 Z" fill="#FBBF24" stroke="#D97706" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M23 37 C24 33, 27 34, 27 38" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Right Hand -->
    <g class="right-hand">
      <polygon points="52,56 40,56 43,43 49,45" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M43 43 L35 20 C35 16, 32 16, 32 20 L32 40 L41 48 Z" fill="#FBBF24" stroke="#D97706" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M41 37 C40 33, 37 34, 37 38" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
