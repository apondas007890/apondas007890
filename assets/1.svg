<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="gojo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="18%" stop-color="#6366F1" stop-opacity=".7"/>
      <stop offset="38%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="1"/>
      <stop offset="62%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="82%" stop-color="#6366F1" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <filter id="gojoGlow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .gojoLine {
        animation: infinity 3s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes infinity {
        0%, 100% {
          opacity: .55;
          transform: scaleX(.88);
        }
        50% {
          opacity: 1;
          transform: scaleX(1);
        }
      }
    </style>
  </defs>

  <rect
    class="gojoLine"
    x="0"
    y="4"
    width="1200"
    height="4"
    rx="2"
    fill="url(#gojo)"
    filter="url(#gojoGlow)"
  />
</svg>