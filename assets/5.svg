<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="maki" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D" stop-opacity="0"/>
      <stop offset="20%" stop-color="#16A34A" stop-opacity=".8"/>
      <stop offset="40%" stop-color="#4ADE80" stop-opacity="1"/>
      <stop offset="50%" stop-color="#DCFCE7" stop-opacity="1"/>
      <stop offset="60%" stop-color="#4ADE80" stop-opacity="1"/>
      <stop offset="80%" stop-color="#16A34A" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#14532D" stop-opacity="0"/>
    </linearGradient>

    <filter id="makiGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .maki {
        animation: strike 2s ease-in-out infinite;
        transform-origin:center;
      }

      @keyframes strike {
        0%,100% { opacity:.35; transform:scaleX(.8); }
        50% { opacity:1; transform:scaleX(1); }
      }
    </style>
  </defs>

  <rect class="maki"
        x="0" y="4"
        width="1200" height="4"
        rx="2"
        fill="url(#maki)"
        filter="url(#makiGlow)"/>

  <rect class="maki"
        x="0" y="4.5"
        width="1200" height="3"
        rx="1.5"
        fill="url(#maki)"/>
</svg>