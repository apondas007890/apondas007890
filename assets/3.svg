<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="yuji" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C2D12" stop-opacity="0"/>
      <stop offset="18%" stop-color="#EA580C" stop-opacity=".75"/>
      <stop offset="38%" stop-color="#F97316" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="1"/>
      <stop offset="62%" stop-color="#F97316" stop-opacity="1"/>
      <stop offset="82%" stop-color="#EA580C" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0"/>
    </linearGradient>

    <filter id="yujiGlow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .yujiLine {
        animation: impact 2.8s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes impact {
        0%, 100% {
          opacity: .5;
          transform: scaleX(.86);
        }
        50% {
          opacity: 1;
          transform: scaleX(1);
        }
      }
    </style>
  </defs>

  <rect
    class="yujiLine"
    x="0"
    y="4"
    width="1200"
    height="4"
    rx="2"
    fill="url(#yuji)"
    filter="url(#yujiGlow)"
  />
</svg>