<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28">
  <defs>
    <!-- Core Fire Glow Filter -->
    <filter id="fireGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Fire Color Gradients -->
    <linearGradient id="outerFire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="45%" stop-color="#EA580C" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <linearGradient id="innerFire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="55%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <style>
      .outer-flame {
        animation: flickerOuter 1.1s ease-in-out infinite alternate;
        transform-origin: 32px 56px;
      }
      .inner-flame {
        animation: flickerInner 0.75s ease-in-out infinite alternate;
        transform-origin: 32px 54px;
      }
      .spark {
        animation: riseSpark 1.6s ease-out infinite;
        transform-origin: 32px 50px;
      }

      @keyframes flickerOuter {
        0%   { transform: scale(0.96, 1.02) skewX(-1.5deg); opacity: 0.92; }
        50%  { transform: scale(1.03, 0.96) skewX(2deg); opacity: 1; }
        100% { transform: scale(0.98, 1.05) skewX(-2deg); opacity: 0.95; }
      }
      @keyframes flickerInner {
        0%   { transform: scale(1.05, 0.94) skewX(2.5deg); }
        50%  { transform: scale(0.93, 1.06) skewX(-1.5deg); }
        100% { transform: scale(1.02, 0.98) skewX(2deg); }
      }
      @keyframes riseSpark {
        0%   { transform: translate(0, 0) scale(1); opacity: 0.9; }
        100% { transform: translate(-3px, -18px) scale(0.2); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Outer Burning Flame -->
  <path class="outer-flame" filter="url(#fireGlow)" fill="url(#outerFire)"
        d="M32 4 C32 4, 38 16, 44 23 C50 30, 56 37, 54 47 C51 57, 42 62, 32 62 C22 62, 13 57, 10 47 C8 36, 15 28, 20 22 C22 30, 27 33, 29 27 C31 20, 32 4, 32 4 Z" />

  <!-- Inner High-Intensity Core -->
  <path class="inner-flame" fill="url(#innerFire)"
        d="M32 20 C32 20, 36 29, 40 34 C44 39, 45 45, 43 51 C40 57, 35 59, 32 59 C29 59, 24 57, 21 51 C19 44, 21 38, 24 33 C26 38, 29 39, 30 35 C31 30, 32 20, 32 20 Z" />

  <!-- Small Rising Spark -->
  <circle class="spark" cx="30" cy="24" r="2" fill="#FDE047" />
</svg>
