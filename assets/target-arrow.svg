<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="30" height="30">
  <defs>
    <!-- Multi-Stage Arrow Flight and Impact Animation -->
    <style>
      .target-board {
        animation: impactVibe 2.4s infinite cubic-bezier(0.36, 0.07, 0.19, 0.97);
        transform-origin: 26px 36px;
      }
      .laser-arrow {
        animation: shootRightToLeft 2.4s infinite cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: 26px 36px;
      }
      .impact-sparks {
        animation: sparkBurst 2.4s infinite ease-out;
        transform-origin: 26px 36px;
      }

      @keyframes shootRightToLeft {
        0% {
          transform: translate(55px, -55px) rotate(-45deg) scale(0.4);
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        32%, 100% {
          transform: translate(0, 0) rotate(-45deg) scale(1);
          opacity: 1;
        }
      }

      @keyframes impactVibe {
        0%, 31% { transform: scale(1) rotate(0deg); }
        33% { transform: scale(0.92) translate(-3px, 3px) rotate(-3deg); filter: drop-shadow(0 0 8px #FBBF24); }
        38% { transform: scale(1.08) translate(2px, -2px) rotate(2deg); }
        45% { transform: scale(0.98) translate(-1px, 1px) rotate(-1deg); }
        55%, 100% { transform: scale(1) translate(0, 0) rotate(0deg); }
      }

      @keyframes sparkBurst {
        0%, 31% { opacity: 0; transform: scale(0.2); }
        34% { opacity: 1; transform: scale(1.4); }
        48%, 100% { opacity: 0; transform: scale(2); }
      }
    </style>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </radialGradient>
  </defs>

  <!-- 3D Angled Target Board -->
  <g class="target-board">
    <ellipse cx="26" cy="36" rx="22" ry="17" fill="url(#ringGlow)" stroke="#7F1D1D" stroke-width="1.5" />
    <ellipse cx="26" cy="36" rx="17" ry="13" fill="#FFFFFF" />
    <ellipse cx="26" cy="36" rx="12" ry="9" fill="#EF4444" />
    <ellipse cx="26" cy="36" rx="7" ry="5.5" fill="#FFFFFF" />
    <ellipse cx="26" cy="36" rx="3.5" ry="2.5" fill="#FBBF24" />
  </g>

  <!-- Impact Energy Sparks -->
  <g class="impact-sparks">
    <circle cx="26" cy="36" r="6" fill="none" stroke="#FBBF24" stroke-width="1.5" />
    <line x1="20" y1="30" x2="16" y2="26" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="32" y1="42" x2="36" y2="46" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- High-Tech Arrow (Embedded at Center) -->
  <g class="laser-arrow">
    <!-- Shaft -->
    <line x1="26" y1="36" x2="62" y2="36" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Glowing Laser Tip -->
    <polygon points="26,36 33,32 31,36 33,40" fill="#FBBF24" />
    <!-- Futuristic Fletching (Feathers) -->
    <polygon points="56,36 62,30 64,36 62,42" fill="#8B5CF6" />
    <line x1="58" y1="32" x2="52" y2="36" stroke="#C084FC" stroke-width="1.5" />
    <line x1="58" y1="40" x2="52" y2="36" stroke="#C084FC" stroke-width="1.5" />
  </g>
</svg>
