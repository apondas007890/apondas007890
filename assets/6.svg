<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="yuta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#164E63" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0891B2" stop-opacity=".8"/>
      <stop offset="40%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ECFEFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="80%" stop-color="#0891B2" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#164E63" stop-opacity="0"/>
    </linearGradient>

    <filter id="yutaGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .yuta {
        animation: yutaPulse 3s ease-in-out infinite;
        transform-origin:center;
      }

      @keyframes yutaPulse {
        0%,100% { opacity:.4; transform:scaleX(.88); }
        50% { opacity:1; transform:scaleX(1); }
      }
    </style>
  </defs>

  <rect class="yuta"
        x="0" y="4"
        width="1200" height="4"
        rx="2"
        fill="url(#yuta)"
        filter="url(#yutaGlow)"/>

  <rect class="yuta"
        x="0" y="4.5"
        width="1200" height="3"
        rx="1.5"
        fill="url(#yuta)"/>
</svg>