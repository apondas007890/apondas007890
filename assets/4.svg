<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="megumi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="20%" stop-color="#312E81" stop-opacity=".8"/>
      <stop offset="40%" stop-color="#6366F1" stop-opacity="1"/>
      <stop offset="50%" stop-color="#C7D2FE" stop-opacity="1"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="1"/>
      <stop offset="80%" stop-color="#312E81" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadowGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .shadow {
        animation: shadow 4s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes shadow {
        0%,100% { opacity:.35; transform:scaleX(.8); }
        50% { opacity:1; transform:scaleX(1); }
      }
    </style>
  </defs>

  <rect class="shadow"
        x="0" y="4"
        width="1200" height="4"
        rx="2"
        fill="url(#megumi)"
        filter="url(#shadowGlow)"/>

  <rect class="shadow"
        x="0" y="4.5"
        width="1200" height="3"
        rx="1.5"
        fill="url(#megumi)"/>
</svg>